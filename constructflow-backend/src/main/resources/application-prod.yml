# Production: every value is supplied by the hosting platform's environment variables.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: true
  allowed-origins: ${ALLOWED_ORIGINS}
  seed:
    enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
